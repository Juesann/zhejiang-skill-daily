<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>浙江省计算机、信息技术和互联网相关技能计划日报</title>
<style>
:root{--blue:#123f67;--soft:#edf4fa;--border:#d9e4ee;--green:#e3f2df;--yellow:#fff4cf;--red:#fce5df}*{box-sizing:border-box}body{margin:0;background:#f5f8fb;color:#182635;font:14px/1.5 "Microsoft YaHei",Arial,sans-serif}.wrap{max-width:1440px;margin:auto;padding:18px}.hero,.panel,.card{background:#fff;border:1px solid var(--border);border-radius:10px}.hero{padding:18px;margin-bottom:12px}.hero h1{font-size:23px;margin:0 0 6px;color:var(--blue)}.meta{display:flex;flex-wrap:wrap;gap:10px;color:#536779}.badge{display:inline-block;padding:3px 8px;border-radius:999px;background:var(--soft);font-weight:700}.bad{background:var(--red);color:#a12c1d}.ok{background:var(--green);color:#21683b}.links{margin-top:12px;display:flex;gap:10px;flex-wrap:wrap}.links a,.detail{color:#075fa8;text-decoration:none}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(155px,1fr));gap:10px;margin:12px 0}.card{padding:12px}.card b{display:block;font-size:24px;color:var(--blue)}.card span{color:#607487}.panel{padding:16px;margin:12px 0}.panel h2{font-size:18px;margin:0;color:var(--blue)}.section-note{color:#607487;margin:4px 0 12px}.focus-summary{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}.focus-stat{background:#f3f7fb;border:1px solid var(--border);border-radius:999px;padding:5px 10px;color:#345}.focus-stat b{color:var(--blue);margin-left:4px}.focus-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.focus-card{border:1px solid var(--border);border-left:5px solid #5088b8;border-radius:8px;padding:12px;background:#fff}.focus-card.risk{border-left-color:#c94c3b;background:#fffafa}.focus-card h3{font-size:15px;line-height:1.45;margin:8px 0}.focus-card .focus-meta{color:#607487;font-size:13px;margin:4px 0}.focus-card .focus-action{background:#f5f8fb;border-radius:6px;padding:7px 9px;margin-top:8px}.focus-card .focus-links{margin-top:8px}.focus-card .badge{margin-right:6px;font-size:12px}.filters{display:grid;grid-template-columns:2fr repeat(7,minmax(115px,1fr));gap:8px}.filters input,.filters select{width:100%;border:1px solid #b8c8d7;border-radius:6px;padding:8px;background:#fff}.tabs{display:flex;overflow:auto;gap:8px;margin:12px 0}.tabs button{white-space:nowrap;border:1px solid #b8c8d7;background:#fff;padding:7px 10px;border-radius:6px;cursor:pointer}.tabs button.active{background:var(--blue);color:#fff}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:1080px}th,td{border-bottom:1px solid var(--border);padding:9px;text-align:left;vertical-align:top}th{background:#f0f5fa;color:#345}td small{color:#5d7080}.pill{padding:3px 6px;border-radius:4px;font-weight:700;white-space:nowrap}.p-open{background:var(--green)}.p-check{background:var(--yellow)}.p-risk{background:var(--red)}details{margin-top:5px}summary{cursor:pointer;color:#075fa8}.pager{display:flex;gap:8px;align-items:center;justify-content:flex-end;padding-top:10px}.pager button{padding:5px 10px}.empty,.error{padding:16px;color:#5d7080}.error{background:var(--red);border-radius:8px;color:#8b2718}.interface{display:flex;gap:8px;flex-wrap:wrap}.interface .badge{font-size:12px}@media(max-width:900px){.focus-list{grid-template-columns:1fr}.filters{grid-template-columns:repeat(3,1fr)}.filters input{grid-column:1/-1}}@media(max-width:600px){.wrap{padding:10px}.hero h1{font-size:19px}.filters{grid-template-columns:1fr 1fr}.cards{grid-template-columns:repeat(2,1fr)}.panel{padding:11px}.focus-card{padding:10px}}
.card{font:inherit;text-align:left;cursor:pointer;appearance:none}.card:hover,.card:focus{border-color:#6d9bc2;box-shadow:0 3px 12px #1d52751a}.card.risk-card{background:var(--red)}.card.pending-card{background:var(--yellow)}.focus-all{border:1px solid #6d9bc2;background:#fff;color:#075fa8;border-radius:6px;padding:6px 10px;margin:0 0 10px;cursor:pointer}.filters{grid-template-columns:repeat(auto-fit,minmax(145px,1fr))}.filters input{grid-column:span 2}.work-main{font-weight:700}.work-role{display:inline-block;margin-top:5px;padding:2px 6px;border-radius:4px;background:var(--soft);color:#456}.quality-serious{color:#a12c1d}.quality-pending{color:#8b6715}@media(max-width:600px){.filters input{grid-column:1/-1}}
</style></head><body><main class="wrap">
<section class="hero"><h1>浙江省计算机、信息技术和互联网相关技能计划日报</h1><div id="meta" class="meta">正在读取日报数据…</div><div class="links"><a href="./latest.xlsx">下载 XLSX</a><a href="./latest.json">查看 JSON</a><a href="./status.json">查看状态</a></div></section>
<section id="cards" class="cards"></section><section class="panel"><h2>今日重点</h2><p id="focus-note" class="section-note">正在计算重点机会…</p><div id="focus-summary" class="focus-summary"></div><button id="focus-all" class="focus-all" type="button">查看全部重点</button><div id="focus" class="focus-list"></div></section>
<section id="filter-panel" class="panel"><h2>查找与筛选</h2><div class="filters"><input id="q" placeholder="名称、机构、职业或竞赛项目关键词"><select id="region"><option value="">全部地区</option></select><select id="level"><option value="">全部等级</option><option>初级工</option><option>中级工</option><option>高级工</option><option>技师</option><option>高级技师</option></select><select id="status"><option value="">全部状态</option><option>当前可报名</option><option>即将报名</option><option>需核验/日期冲突</option></select><select id="priority"><option value="">全部优先级</option><option>最高</option><option>高</option><option>中</option></select><select id="deadline"><option value="">全部截止风险</option><option>今日截止</option><option>3日内截止</option><option>7日内截止</option></select><select id="discovery"><option value="">发现时间不限</option><option value="yes">仅今日新发现</option></select><select id="quality"><option value="">质量不限</option><option value="serious">仅需人工核验</option><option value="pending">仅字段待补充</option></select><select id="competition-role"><option value="">竞赛角色不限</option><option value="player">选手报名</option><option value="judge">裁判员报名</option></select><select id="opportunity"><option value="">重点机会不限</option><option>一级/高级技师</option><option>考评员</option><option>高级考评员</option><option>网络安全竞赛</option><option>数据安全竞赛</option><option>人工智能竞赛</option><option>竞赛裁判机会</option></select></div><div id="tabs" class="tabs"></div></section>
<section class="panel"><div id="results"></div><div id="pager" class="pager"></div></section><section class="panel"><details><summary>检索日志（默认折叠）</summary><div id="logs"></div></details></section>
</main><script>
const state={data:null,cat:'all',page:1,size:25,focusOnly:false};const $=id=>document.getElementById(id);const txt=v=>String(v??'');
function el(tag,text,cls){const n=document.createElement(tag);if(text!==undefined)n.textContent=text;if(cls)n.className=cls;return n}
function priorityClass(r){return r.status.includes('冲突')||r.deadline_bucket==='今日截止'||r.priority==='最高'?'p-risk':r.deadline_bucket==='3日内截止'||r.priority==='高'?'p-check':r.status==='当前可报名'?'p-open':''}
function renderMeta(d){const m=$('meta');m.replaceChildren();m.append(el('span','日报日期：'+txt(d.report_date)));m.append(el('span','生成：'+txt(d.generated_at)));m.append(el('span',d.complete?'完整核验版':'不完整核验版',d.complete?'badge ok':'badge bad'));const it=el('div','', 'interface');Object.entries(d.interfaces||{}).forEach(([k,v])=>it.append(el('span',`${k}：${v.ok?'成功':'失败'}`,v.ok?'badge ok':'badge bad')));m.append(it)}
function resetFilters(){['q','region','level','status','priority','deadline','discovery','quality','competition-role','opportunity'].forEach(id=>$(id).value='');state.focusOnly=false}
function applyPreset(preset={}){resetFilters();state.cat=preset.cat||'all';state.focusOnly=!!preset.focus;Object.entries(preset).forEach(([id,value])=>{if($(id))$(id).value=value});state.page=1;render();$('filter-panel').scrollIntoView({behavior:'smooth',block:'start'})}
function renderCards(d){const specs=[['需立即处理',(d.urgent_records||[]).length,{focus:true}],['今日截止',d.summary?.urgent_today,{deadline:'今日截止'}],['3日内截止',d.summary?.urgent_3_days,{deadline:'3日内截止'}],['当前可报名',d.summary?.current_open,{status:'当前可报名'}],['即将报名',d.summary?.upcoming,{status:'即将报名'}],['一级/高级技师',d.summary?.advanced_technician,{opportunity:'一级/高级技师'}],['普通考评员',d.summary?.ordinary_assessor,{opportunity:'考评员'}],['网络安全高级考评员',d.summary?.network_security_senior_assessor,{opportunity:'高级考评员'}],['竞赛选手机会',d.summary?.competition_player,{cat:'competition','competition-role':'player'}],['竞赛裁判机会',d.summary?.competition_judge,{cat:'competition','competition-role':'judge'}],['今日新发现',d.summary?.first_seen_today,{discovery:'yes'}],['需人工核验',d.summary?.serious_quality,{quality:'serious'}],['字段待补充',d.summary?.fields_pending,{quality:'pending'}]];const p=$('cards');p.replaceChildren();specs.forEach(([label,count,preset])=>{const cls=label==='需人工核验'?'card risk-card':label==='字段待补充'?'card pending-card':'card';const x=el('button',undefined,cls);x.type='button';x.title='点击筛选：'+label;x.append(el('b',txt(count||0)));x.append(el('span',label));x.onclick=()=>applyPreset(preset);p.append(x)})}
function isFocus(r){return r.first_seen_today||r.deadline_bucket==='今日截止'||r.deadline_bucket==='3日内截止'||r.priority==='最高'||r.status==='需核验/日期冲突'}
function focusRank(r){if(r.deadline_bucket==='今日截止')return 0;if(r.deadline_bucket==='3日内截止')return 1;if(r.status==='需核验/日期冲突')return 2;if(r.priority==='最高')return 3;if(r.first_seen_today)return 4;if(r.priority==='高')return 5;return 6}
function renderFocus(d){const specs=[['今日新发现',r=>r.first_seen_today],['今日截止',r=>r.deadline_bucket==='今日截止'],['3日内截止',r=>r.deadline_bucket==='3日内截止'],['最高优先级',r=>r.priority==='最高'],['需人工核验',r=>(r.serious_quality_flags||[]).length>0]];const summary=$('focus-summary');summary.replaceChildren();specs.forEach(([label,fn])=>{const node=el('span',label,'focus-stat');node.append(el('b',(d.records||[]).filter(fn).length));summary.append(node)});const all=(d.records||[]).filter(isFocus).sort((a,b)=>focusRank(a)-focusRank(b)||(a.signup_end||'9999').localeCompare(b.signup_end||'9999')||(a.name||'').localeCompare(b.name||'','zh-CN'));$('focus-note').textContent=`共 ${all.length} 条，当前展示优先级最高的 ${Math.min(10,all.length)} 条；排序口径为截止风险、日期冲突、优先级和今日新发现。`;$('focus-all').hidden=all.length<=10;$('focus-all').onclick=()=>applyPreset({focus:true});const root=$('focus');root.replaceChildren();const rows=all.slice(0,10);if(!rows.length){root.append(el('div','本项暂无记录','empty'));return}rows.forEach(r=>{const box=el('article',undefined,'focus-card '+(priorityClass(r)==='p-risk'?'risk':''));const tags=el('div');tags.append(el('span',r.deadline_bucket||r.status,'badge '+priorityClass(r)));tags.append(el('span',r.priority+'优先级','badge'));tags.append(el('span',r.information_category||r.category_name,'badge'));if(r.first_seen_today)tags.append(el('span','今日新发现','badge'));box.append(tags);box.append(el('h3',r.name));const work=r.category==='competition'?r.competition_project_display:[r.occupation,r.level_or_type].filter(Boolean).join(' / ');box.append(el('div',[r.region||'地区待核验',work||'职业信息待核验',r.signup_end?'截止 '+r.signup_end:'截止待核验'].join(' · '),'focus-meta'));if(r.category==='competition')box.append(el('div','报名角色：'+(r.competition_role_label||r.competition_registration_type||'待核验'),'focus-meta'));box.append(el('div',r.action||'请进入平台核验','focus-action'));if(r.source_url){const links=el('div',undefined,'focus-links'),a=el('a','直达平台详情','detail');a.href=r.source_url;a.target='_blank';a.rel='noopener';links.append(a);box.append(links)}root.append(box)})}
function populateFilters(d){const select=$('region');const values=[...new Set((d.records||[]).flatMap(r=>r.regions||[]))].sort((a,b)=>a.length-b.length||a.localeCompare(b,'zh-CN'));values.forEach(value=>{const option=el('option',value);option.value=value;select.append(option)})}
function renderTabs(){const tabs=[['all','全部'],['training','培训报名'],['evaluation','评价报名'],['notice','计划认定公告补漏（未接入）'],['expert','专家培养'],['competition','技能竞赛'],['other','其他渠道（未接入）'],['logs','检索日志']];const root=$('tabs');root.replaceChildren();tabs.forEach(([id,label])=>{const b=el('button',label,id===state.cat?'active':'');b.onclick=()=>{state.cat=id;state.focusOnly=false;state.page=1;render()};root.append(b)})}
function qualityMatch(r,quality){if(!quality)return true;if(quality==='serious')return (r.serious_quality_flags||[]).length>0;return (r.supplemental_quality_flags||[]).length>0&&!(r.serious_quality_flags||[]).length}
function filtered(){const q=$('q').value.trim().toLowerCase(),region=$('region').value,level=$('level').value,status=$('status').value,priority=$('priority').value,deadline=$('deadline').value,discovery=$('discovery').value,quality=$('quality').value,role=$('competition-role').value,opportunity=$('opportunity').value;return (state.data.records||[]).filter(r=>{if(state.cat!=='all'&&['notice','other','logs'].includes(state.cat))return false;if(state.cat!=='all'&&r.category!==state.cat)return false;const hay=[r.name,r.occupation,r.sub_occupation,r.organization,r.competition_project_display,r.eligibility_summary,r.registration_materials_summary].join(' ').toLowerCase();return (!state.focusOnly||isFocus(r))&&(!q||hay.includes(q))&&(!region||(r.regions||[]).includes(region))&&(!level||r.level_group===level)&&(!status||r.status===status)&&(!priority||r.priority===priority)&&(!deadline||r.deadline_bucket===deadline)&&(!discovery||r.first_seen_today)&&(!role||r.competition_role===role)&&(!opportunity||(r.opportunity_tags||[]).includes(opportunity))&&qualityMatch(r,quality)})}
function render(){renderTabs();if(['notice','other'].includes(state.cat)){$('results').replaceChildren(el('div','本轮尚未接入，不计入完整性判断。','empty'));$('pager').replaceChildren();return}if(state.cat==='logs'){$('results').replaceChildren(el('div','请展开下方检索日志查看接口、关键词和行数核对。','empty'));$('pager').replaceChildren();return}const rows=filtered(),from=(state.page-1)*state.size,part=rows.slice(from,from+state.size),root=$('results');root.replaceChildren();if(!part.length){root.append(el('div','本项暂无记录','empty'));$('pager').replaceChildren();return}const wrap=el('div',undefined,'table-wrap'),table=document.createElement('table'),head=document.createElement('thead'),tr=document.createElement('tr');const workHeader=state.cat==='competition'?'竞赛项目':state.cat==='all'?'职业/等级或竞赛项目':'职业/等级';['名称',workHeader,'机构/区域','报名或截止','活动时间','状态','优先级','建议动作','详情'].forEach(h=>tr.append(el('th',h)));head.append(tr);table.append(head);const body=document.createElement('tbody');part.forEach(r=>{const row=document.createElement('tr');row.append(el('td',r.name));const workCell=document.createElement('td');if(r.category==='competition'){workCell.append(el('div',r.competition_project_display||'项目待核验','work-main'));workCell.append(el('span',r.competition_role_label||r.competition_registration_type||'角色待核验','work-role'))}else workCell.append(el('div',[r.occupation,r.level_or_type].filter(Boolean).join(' / ')));row.append(workCell);const cells=[`${r.organization||''}${r.region?' / '+r.region:''}`,`${r.signup_start||''} ${r.signup_end?'至 '+r.signup_end:''}${r.days_to_deadline!==null&&r.days_to_deadline!==undefined?'（'+r.days_to_deadline+'天）':''}`,r.event_time,r.status,r.priority,r.action];cells.forEach((v,i)=>{const c=el('td',v);if(i===3||i===4)c.className='pill '+priorityClass(r);row.append(c)});const c=document.createElement('td');if(r.source_url){const a=el('a','直达平台详情','detail');a.href=r.source_url;a.target='_blank';a.rel='noopener';c.append(a)}else c.append(el('span','需平台内核验'));const d=document.createElement('details'),s=el('summary','更多字段');d.append(s);const extras=[];if((r.target_certificates||[]).length)extras.push('目标证书：'+r.target_certificates.join('、'));if(r.training_value_status)extras.push('培训价值：'+r.training_value_status);if(r.category==='competition'){extras.push('竞赛报名类型：'+(r.competition_registration_type||'待核验'));extras.push('资格摘要：'+(r.eligibility_summary||'待核验'));extras.push('材料摘要：'+(r.registration_materials_summary||'待核验'));extras.push('平台有联系方式：'+(r.contact_available?'是，请直达详情':'未识别'))}if(r.match_basis)extras.push('匹配依据：'+r.match_basis);extras.push(`首次纳入：${r.first_seen_date||'历史记录，日期未留存'}`,`新发现说明：${r.new_reason||'—'}`,`计划编号：${r.plan_no||'—'}`,`唯一ID：${r.unique_id||'—'}`,`地区依据：${r.region_source||'待核验'}`,`严重异常：${(r.serious_quality_flags||[]).join('、')||'无'}`,`字段待补充：${(r.supplemental_quality_flags||[]).join('、')||'无'}`);d.append(el('small',extras.join('；')));c.append(d);row.append(c);body.append(row)});table.append(body);wrap.append(table);root.append(wrap);const pages=Math.max(1,Math.ceil(rows.length/state.size)),pager=$('pager');pager.replaceChildren();const prev=el('button','上一页');prev.disabled=state.page<=1;prev.onclick=()=>{state.page--;render()};const next=el('button','下一页');next.disabled=state.page>=pages;next.onclick=()=>{state.page++;render()};pager.append(prev,el('span',`第 ${state.page}/${pages} 页，共 ${rows.length} 条${state.focusOnly?'（全部重点）':''}`),next)}
function renderLogs(d){const root=$('logs'),rows=d.search_logs||[];if(!rows.length){root.textContent='暂无检索日志';return}const table=document.createElement('table'),h=document.createElement('tr');['接口','关键词','状态','reported_total','actual_rows','页数','去重后','说明'].forEach(x=>h.append(el('th',x)));table.append(h);rows.forEach(r=>{const tr=document.createElement('tr');[r.category,r.keyword,r.ok?'成功':'失败',r.reported_total,r.actual_rows,r.pages,r.deduplicated_count,r.note].forEach((x,i)=>{const c=el('td',txt(x));if(i===3&&txt(r.reported_total)!==txt(r.actual_rows))c.className='p-check';tr.append(c)});table.append(tr)});root.replaceChildren(el('div',undefined,'table-wrap'));root.firstChild.append(table)}
['q','region','level','status','priority','deadline','discovery','quality','competition-role','opportunity'].forEach(id=>$(id).addEventListener('input',()=>{state.focusOnly=false;state.page=1;render()}));fetch('./latest.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('HTTP '+r.status);return r.json()}).then(d=>{state.data=d;populateFilters(d);renderMeta(d);renderCards(d);renderFocus(d);renderLogs(d);render()}).catch(e=>{$('meta').textContent='日报数据读取失败：'+e.message;$('results').replaceChildren(el('div','无法读取 latest.json，请稍后重试或下载 JSON 核验。','error'))});
</script></body></html>

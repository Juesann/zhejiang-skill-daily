<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>浙江省计算机、信息技术和互联网相关技能计划日报</title>
<style>
:root{--blue:#123f67;--soft:#edf4fa;--border:#d9e4ee;--green:#e3f2df;--yellow:#fff4cf;--red:#fce5df}*{box-sizing:border-box}body{margin:0;background:#f5f8fb;color:#182635;font:14px/1.5 "Microsoft YaHei",Arial,sans-serif}.wrap{max-width:1440px;margin:auto;padding:18px}.hero,.panel,.card{background:#fff;border:1px solid var(--border);border-radius:10px}.hero{padding:18px;margin-bottom:12px}.hero h1{font-size:23px;margin:0 0 6px;color:var(--blue)}.meta{display:flex;flex-wrap:wrap;gap:10px;color:#536779}.badge{display:inline-block;padding:3px 8px;border-radius:999px;background:var(--soft);font-weight:700}.bad{background:var(--red);color:#a12c1d}.ok{background:var(--green);color:#21683b}.links{margin-top:12px;display:flex;gap:10px;flex-wrap:wrap}.links a,.detail{color:#075fa8;text-decoration:none}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(155px,1fr));gap:10px;margin:12px 0}.card{padding:12px}.card b{display:block;font-size:24px;color:var(--blue)}.card span{color:#607487}.panel{padding:16px;margin:12px 0}.panel h2{font-size:18px;margin:0;color:var(--blue)}.section-note{color:#607487;margin:4px 0 12px}.focus-summary{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}.focus-stat{background:#f3f7fb;border:1px solid var(--border);border-radius:999px;padding:5px 10px;color:#345}.focus-stat b{color:var(--blue);margin-left:4px}.focus-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.focus-card{border:1px solid var(--border);border-left:5px solid #5088b8;border-radius:8px;padding:12px;background:#fff}.focus-card.risk{border-left-color:#c94c3b;background:#fffafa}.focus-card h3{font-size:15px;line-height:1.45;margin:8px 0}.focus-card .focus-meta{color:#607487;font-size:13px;margin:4px 0}.focus-card .focus-action{background:#f5f8fb;border-radius:6px;padding:7px 9px;margin-top:8px}.focus-card .focus-links{margin-top:8px}.focus-card .badge{margin-right:6px;font-size:12px}.filters{display:grid;grid-template-columns:2fr repeat(7,minmax(115px,1fr));gap:8px}.filters input,.filters select{width:100%;border:1px solid #b8c8d7;border-radius:6px;padding:8px;background:#fff}.tabs{display:flex;overflow:auto;gap:8px;margin:12px 0}.tabs button{white-space:nowrap;border:1px solid #b8c8d7;background:#fff;padding:7px 10px;border-radius:6px;cursor:pointer}.tabs button.active{background:var(--blue);color:#fff}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:1080px}th,td{border-bottom:1px solid var(--border);padding:9px;text-align:left;vertical-align:top}th{background:#f0f5fa;color:#345}td small{color:#5d7080}.pill{padding:3px 6px;border-radius:4px;font-weight:700;white-space:nowrap}.p-open{background:var(--green)}.p-check{background:var(--yellow)}.p-risk{background:var(--red)}details{margin-top:5px}summary{cursor:pointer;color:#075fa8}.pager{display:flex;gap:8px;align-items:center;justify-content:flex-end;padding-top:10px}.pager button{padding:5px 10px}.empty,.error{padding:16px;color:#5d7080}.error{background:var(--red);border-radius:8px;color:#8b2718}.interface{display:flex;gap:8px;flex-wrap:wrap}.interface .badge{font-size:12px}@media(max-width:900px){.focus-list{grid-template-columns:1fr}.filters{grid-template-columns:repeat(3,1fr)}.filters input{grid-column:1/-1}}@media(max-width:600px){.wrap{padding:10px}.hero h1{font-size:19px}.filters{grid-template-columns:1fr 1fr}.cards{grid-template-columns:repeat(2,1fr)}.panel{padding:11px}.focus-card{padding:10px}}
</style></head><body><main class="wrap">
<section class="hero"><h1>浙江省计算机、信息技术和互联网相关技能计划日报</h1><div id="meta" class="meta">正在读取日报数据…</div><div class="links"><a href="./latest.xlsx">下载 XLSX</a><a href="./latest.json">查看 JSON</a><a href="./status.json">查看状态</a></div></section>
<section id="cards" class="cards"></section><section class="panel"><h2>今日重点</h2><p class="section-note">按截止风险和优先级排序；每条计划独立展示，便于直接判断下一步。</p><div id="focus-summary" class="focus-summary"></div><div id="focus" class="focus-list"></div></section>
<section class="panel"><h2>查找与筛选</h2><div class="filters"><input id="q" placeholder="名称、机构、职业或竞赛项目关键词"><select id="region"><option value="">全部地区</option></select><select id="level"><option value="">全部等级</option><option>初级工</option><option>中级工</option><option>高级工</option><option>技师及高级技师</option></select><select id="status"><option value="">全部状态</option><option>当前可报名</option><option>即将报名</option><option>需核验/日期冲突</option></select><select id="priority"><option value="">全部优先级</option><option>最高</option><option>高</option><option>中</option></select><select id="deadline"><option value="">全部截止风险</option><option>今日截止</option><option>3日内截止</option><option>7日内截止</option></select><select id="new"><option value="">新增不限</option><option value="yes">仅今日新增</option></select><select id="quality"><option value="">质量不限</option><option value="yes">仅数据异常</option></select></div><div id="tabs" class="tabs"></div></section>
<section class="panel"><div id="results"></div><div id="pager" class="pager"></div></section><section class="panel"><details><summary>检索日志（默认折叠）</summary><div id="logs"></div></details></section>
</main><script>
const state={data:null,cat:'all',page:1,size:25};const $=id=>document.getElementById(id);const txt=v=>String(v??'');
function el(tag,text,cls){const n=document.createElement(tag);if(text!==undefined)n.textContent=text;if(cls)n.className=cls;return n}
function priorityClass(r){return r.status.includes('冲突')||r.deadline_bucket==='今日截止'||r.priority==='最高'?'p-risk':r.deadline_bucket==='3日内截止'||r.priority==='高'?'p-check':r.status==='当前可报名'?'p-open':''}
function renderMeta(d){const m=$('meta');m.replaceChildren();m.append(el('span','日报日期：'+txt(d.report_date)));m.append(el('span','生成：'+txt(d.generated_at)));m.append(el('span',d.complete?'完整核验版':'不完整核验版',d.complete?'badge ok':'badge bad'));const it=el('div','', 'interface');Object.entries(d.interfaces||{}).forEach(([k,v])=>it.append(el('span',`${k}：${v.ok?'成功':'失败'}`,v.ok?'badge ok':'badge bad')));m.append(it)}
function renderCards(d){const labels=[['需立即处理','urgent_records'],['今日截止','urgent_today'],['3日内截止','urgent_3_days'],['当前可报名','current_open'],['即将报名','upcoming'],['一级/高级技师','advanced_technician'],['普通考评员','ordinary_assessor'],['网络安全高级考评员','network_security_senior_assessor'],['技能竞赛','competition'],['今日新增','new_today'],['数据质量异常','data_quality_warning']];const p=$('cards');p.replaceChildren();labels.forEach(([l,k])=>{const x=el('div',undefined,'card');x.append(el('b',k==='urgent_records'?(d.urgent_records||[]).length:txt(d.summary?.[k]||0)));x.append(el('span',l));p.append(x)})}
function renderFocus(d){const specs=[['今日新增',r=>r.new_today],['今日截止',r=>r.deadline_bucket==='今日截止'],['3日内截止',r=>r.deadline_bucket==='3日内截止'],['最高优先级',r=>r.priority==='最高'],['需人工确认',r=>r.status==='需核验/日期冲突']];const summary=$('focus-summary');summary.replaceChildren();specs.forEach(([label,fn])=>{const node=el('span',label,'focus-stat');node.append(el('b',(d.records||[]).filter(fn).length));summary.append(node)});const root=$('focus');root.replaceChildren();const rows=(d.records||[]).filter(r=>r.new_today||r.deadline_bucket==='今日截止'||r.deadline_bucket==='3日内截止'||r.priority==='最高'||r.status==='需核验/日期冲突').slice(0,10);if(!rows.length){root.append(el('div','本项暂无记录','empty'));return}rows.forEach(r=>{const box=el('article',undefined,'focus-card '+(priorityClass(r)==='p-risk'?'risk':''));const tags=el('div');tags.append(el('span',r.deadline_bucket||r.status,'badge '+priorityClass(r)));tags.append(el('span',r.priority+'优先级','badge'));tags.append(el('span',r.information_category||r.category_name,'badge'));box.append(tags);box.append(el('h3',r.name));const work=r.category==='competition'?r.competition_registration_type:[r.occupation,r.level_or_type].filter(Boolean).join(' / ');box.append(el('div',[r.region||'地区待核验',work||'职业信息待核验',r.signup_end?'截止 '+r.signup_end:'截止待核验'].join(' · '),'focus-meta'));if(r.category==='competition'&&(r.competition_projects||[]).length)box.append(el('div','命中项目：'+r.competition_projects.slice(0,4).join('、'),'focus-meta'));box.append(el('div',r.action||'请进入平台核验','focus-action'));if(r.source_url){const links=el('div',undefined,'focus-links'),a=el('a','直达平台详情','detail');a.href=r.source_url;a.target='_blank';a.rel='noopener';links.append(a);box.append(links)}root.append(box)})}
function populateFilters(d){const select=$('region');const values=[...new Set((d.records||[]).flatMap(r=>r.regions||[]))].sort((a,b)=>a.length-b.length||a.localeCompare(b,'zh-CN'));values.forEach(value=>{const option=el('option',value);option.value=value;select.append(option)})}
function renderTabs(){const tabs=[['all','全部'],['training','培训报名'],['evaluation','评价报名'],['notice','计划认定公告补漏（未接入）'],['expert','专家培养'],['competition','技能竞赛'],['other','其他渠道（未接入）'],['logs','检索日志']];const root=$('tabs');root.replaceChildren();tabs.forEach(([id,label])=>{const b=el('button',label,id===state.cat?'active':'');b.onclick=()=>{state.cat=id;state.page=1;render()};root.append(b)})}
function filtered(){const q=$('q').value.trim().toLowerCase(),region=$('region').value,level=$('level').value,status=$('status').value,priority=$('priority').value,deadline=$('deadline').value,isNew=$('new').value,quality=$('quality').value;return (state.data.records||[]).filter(r=>{if(state.cat!=='all'&&['notice','other','logs'].includes(state.cat))return false;if(state.cat!=='all'&&r.category!==state.cat)return false;const hay=[r.name,r.occupation,r.sub_occupation,r.organization,(r.competition_projects||[]).join(' '),r.training_content].join(' ').toLowerCase();return (!q||hay.includes(q))&&(!region||(r.regions||[]).includes(region))&&(!level||r.level_group===level)&&(!status||r.status===status)&&(!priority||r.priority===priority)&&(!deadline||r.deadline_bucket===deadline)&&(!isNew||r.new_today)&&(!quality||(r.data_quality_flags||[]).length)})}
function render(){renderTabs();if(['notice','other'].includes(state.cat)){ $('results').replaceChildren(el('div','本轮尚未接入，不计入完整性判断。','empty'));$('pager').replaceChildren();return}if(state.cat==='logs'){ $('results').replaceChildren(el('div','请展开下方检索日志查看接口、关键词和行数核对。','empty'));$('pager').replaceChildren();return}const rows=filtered(),from=(state.page-1)*state.size,part=rows.slice(from,from+state.size),root=$('results');root.replaceChildren();if(!part.length){root.append(el('div','本项暂无记录','empty'));$('pager').replaceChildren();return}const wrap=el('div',undefined,'table-wrap'),table=document.createElement('table'),head=document.createElement('thead'),tr=document.createElement('tr');const workHeader=state.cat==='competition'?'竞赛报名类型':state.cat==='all'?'职业/等级或竞赛报名类型':'职业/等级';['名称',workHeader,'机构/区域','报名或截止','活动时间','状态','优先级','建议动作','详情'].forEach(h=>tr.append(el('th',h)));head.append(tr);table.append(head);const body=document.createElement('tbody');part.forEach(r=>{const row=document.createElement('tr');const work=r.category==='competition'?(r.competition_registration_type||'待核验'):[r.occupation,r.level_or_type].filter(Boolean).join(' / ');const cells=[r.name,work,`${r.organization||''}${r.region?' / '+r.region:''}`,`${r.signup_start||''} ${r.signup_end?'至 '+r.signup_end:''}${r.days_to_deadline!==null&&r.days_to_deadline!==undefined?'（'+r.days_to_deadline+'天）':''}`,r.event_time,r.status,r.priority,r.action];cells.forEach((v,i)=>{const c=el('td',v);if(i===5||i===6)c.className='pill '+priorityClass(r);row.append(c)});const c=document.createElement('td');if(r.source_url){const a=el('a','直达平台详情','detail');a.href=r.source_url;a.target='_blank';a.rel='noopener';c.append(a)}else c.append(el('span','需平台内核验'));const d=document.createElement('details'),s=el('summary','更多字段');d.append(s);const extras=[];if((r.target_certificates||[]).length)extras.push('目标证书：'+r.target_certificates.join('、'));if(r.training_value_status)extras.push('培训价值：'+r.training_value_status);if((r.competition_projects||[]).length)extras.push('竞赛项目：'+r.competition_projects.join('、'));if(r.match_basis)extras.push('匹配依据：'+r.match_basis);extras.push(`计划编号：${r.plan_no||'—'}`,`唯一ID：${r.unique_id||'—'}`,`命中关键词：${(r.matched_keywords||[]).join('、')}`,`地区依据：${r.region_source||'待核验'}`,`链接核验：${r.verification_status||'—'}`,`资格初判：${r.qualification_initial||'—'}`,`质量标记：${(r.data_quality_flags||[]).join('、')||'无'}`);d.append(el('small',extras.join('；')));c.append(d);row.append(c);body.append(row)});table.append(body);wrap.append(table);root.append(wrap);const pages=Math.max(1,Math.ceil(rows.length/state.size)),pager=$('pager');pager.replaceChildren();const prev=el('button','上一页');prev.disabled=state.page<=1;prev.onclick=()=>{state.page--;render()};const next=el('button','下一页');next.disabled=state.page>=pages;next.onclick=()=>{state.page++;render()};pager.append(prev,el('span',`第 ${state.page}/${pages} 页，共 ${rows.length} 条`),next)}
function renderLogs(d){const root=$('logs'),rows=d.search_logs||[];if(!rows.length){root.textContent='暂无检索日志';return}const table=document.createElement('table'),h=document.createElement('tr');['接口','关键词','状态','reported_total','actual_rows','页数','去重后','说明'].forEach(x=>h.append(el('th',x)));table.append(h);rows.forEach(r=>{const tr=document.createElement('tr');[r.category,r.keyword,r.ok?'成功':'失败',r.reported_total,r.actual_rows,r.pages,r.deduplicated_count,r.note].forEach((x,i)=>{const c=el('td',txt(x));if(i===3&&txt(r.reported_total)!==txt(r.actual_rows))c.className='p-check';tr.append(c)});table.append(tr)});root.replaceChildren(el('div',undefined,'table-wrap'));root.firstChild.append(table)}
['q','region','level','status','priority','deadline','new','quality'].forEach(id=>$(id).addEventListener('input',()=>{state.page=1;render()}));fetch('./latest.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('HTTP '+r.status);return r.json()}).then(d=>{state.data=d;populateFilters(d);renderMeta(d);renderCards(d);renderFocus(d);renderLogs(d);render()}).catch(e=>{$('meta').textContent='日报数据读取失败：'+e.message;$('results').replaceChildren(el('div','无法读取 latest.json，请稍后重试或下载 JSON 核验。','error'))});
</script></body></html>
